<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e40af;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    <filter id="textShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Background circle with blue gradient -->
  <circle cx="64" cy="64" r="62" fill="url(#bgGrad)"/>
  <!-- Subtle inner border for depth -->
  <circle cx="64" cy="64" r="58" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
  <!-- cR text - bold and centered -->
  <text 
    x="64" 
    y="88" 
    font-family="system-ui, -apple-system, 'Segoe UI', 'Arial', sans-serif" 
    font-size="78" 
    font-weight="900" 
    fill="white" 
    text-anchor="middle" 
    dominant-baseline="middle"
    filter="url(#textShadow)"
    style="letter-spacing: -2px;">cR</text>
</svg>
